server {
    listen 80;
    server_name localhost;

    # 1. Раздача самого сайта (React/Vue)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Проксирование картинок на бэкенд
    # Все запросы, начинающиеся на /uploads/, Nginx перешлет в контейнер store-backend
    location /uploads/ {
        proxy_pass http://store-backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Бонус: Проксирование API (если захотите навсегда забыть про проблемы с CORS)
    # location /api/v1/ {
    #     proxy_pass http://store-backend:8000/api/v1/;
    #     proxy_set_header Host $host;
    # }
}